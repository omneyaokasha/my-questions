<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استبيان</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
padding:40px;
direction:rtl;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
}

input, textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:10px;
}

button{
background:#4CAF50;
color:white;
padding:12px;
width:100%;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>نموذج تسجيل</h2>

<form>
<label>الاسم</label>
<input type="text">

<label>رقم الهاتف</label>
<input type="text">

<label>رأيك أو رسالتك</label>
<textarea rows="5"></textarea>

<button type="submit">إرسال</button>
</form>

</div>

</body>
</html>
